name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    # rust-toolchain.toml 里的 target 后缀 channel 会被 runner 上的新版 rustup
    # 拒绝（error: target tuple in channel name）；用环境变量覆盖文件解析，
    # 显式安装 GNU 工具链。RUSTUP_TOOLCHAIN 优先级高于 rust-toolchain.toml。
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable-x86_64-pc-windows-gnu

      # GNU 目标需要 MinGW 的 as/dlltool（runner 预装 mingw）
      - name: Add MinGW to PATH
        shell: pwsh
        run: |
          $mingw = "C:\ProgramData\mingw64\mingw64\bin"
          if (-not (Test-Path $mingw)) { $mingw = "C:\mingw64\bin" }
          if (-not (Test-Path $mingw)) { choco install mingw -y --no-progress; $mingw = "C:\ProgramData\mingw64\mingw64\bin" }
          Add-Content -Path $env:GITHUB_PATH -Value $mingw
          & "$mingw\gcc.exe" --version

      - name: Rust tests
        run: cargo test --workspace

      - name: Build release
        run: cargo build --release

      - name: Band app build (RPK)
        shell: pwsh
        run: |
          cd band-app
          npm install
          npm run build

      - name: Package
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/package.ps1 -Root ${{ github.workspace }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MiBandNotifier-windows
          path: |
            dist/*.zip
            band-app/dist/*.rpk
          if-no-files-found: warn
