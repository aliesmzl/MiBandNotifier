[package]
name = "miband-notifier"
description = "把 zcode 任务事件与 AI 额度信息推送到小米手环（ntfy 通知镜像 + 手环快应用）"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "MiBandNotifier"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.3"
if-addrs = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-winrt-notification = "0.7"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "process", "sync", "time"] }
toml = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
